[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-regressor"
version = "0.1.0"
description = "Detect regressions between LLM model versions or prompt changes: factuality, format, tone, latency, cost."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Siddharth Gaur" }]
keywords = ["llm", "testing", "regression", "prompt-engineering", "eval", "anthropic", "openai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
# Lower bounds only: this is a library, and pinning upper bounds here would
# propagate a resolver conflict into every application that installs it.
dependencies = [
  "click>=8.1",
  "rich>=13.7",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
litellm = ["litellm>=1.50"]
embeddings = ["sentence-transformers>=3.0"]
ollama = ["requests>=2.31"]
slack = ["httpx>=0.27"]
all = [
  "anthropic>=0.40",
  "openai>=1.50",
  "litellm>=1.50",
  "sentence-transformers>=3.0",
  "requests>=2.31",
  "httpx>=0.27",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/siddharthgaur1/llm-regressor"
Repository = "https://github.com/siddharthgaur1/llm-regressor"
Documentation = "https://siddharthgaur1.github.io/llm-regressor/"
Changelog = "https://github.com/siddharthgaur1/llm-regressor/blob/master/CHANGELOG.md"
Issues = "https://github.com/siddharthgaur1/llm-regressor/issues"

[project.scripts]
llm-regressor = "llm_regressor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["llm_regressor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]

[tool.coverage.run]
source = ["llm_regressor"]
branch = true

[tool.coverage.report]
# The suite is at 100% (statement and branch). The gate sits at 90 on purpose:
# a 100% gate turns every future PR into a coverage-chasing exercise and
# pressures people into writing assertion-free tests to clear it.
fail_under = 90
exclude_lines = [
  "pragma: no cover",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
# 140 rather than 88/120: several lines are single CLI help strings or judge
# criteria that read worse wrapped than long.
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # click decorators legitimately call functions in defaults
  "A002",  # `length_range(min=, max=)` shadows builtins by design: those are the YAML keys
]

[tool.ruff.lint.per-file-ignores]
"llm_regressor/checks/deterministic.py" = ["A002"]
